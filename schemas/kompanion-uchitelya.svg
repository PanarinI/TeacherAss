<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 470" role="img" font-family="'Helvetica Neue',Arial,sans-serif">
<title>Компаньон учителя: живая память превращает инструмент в компаньона</title>
<desc>Тело Reachy Mini несёт душу-методиста и живую память; память помнит учебный план, каждого ученика и самого учителя; по запросу компаньон собирает план урока и раздатки и отправляет на печать после одобрения; за полгода узнаёт учителя и класс и едет с ним в кабинет.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker>
</defs>

<rect x="44" y="40" width="200" height="52" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="144" y="64" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">инструмент</text>
<text x="144" y="82" text-anchor="middle" font-size="12" fill="#5F5E5A">с нуля каждый раз</text>
<line x1="250" y1="66" x2="430" y2="66" stroke="#1D9E75" stroke-width="2" marker-end="url(#ar)"/>
<text x="340" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">живая память</text>
<rect x="436" y="40" width="200" height="52" rx="8" fill="#E1F5EE" stroke="#1D9E75"/>
<text x="536" y="64" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">компаньон</text>
<text x="536" y="82" text-anchor="middle" font-size="12" fill="#0F6E56">помнит и растёт</text>

<text x="44" y="118" text-anchor="start" font-size="12" fill="#5F5E5A">помнит:</text>
<rect x="44" y="126" width="168" height="42" rx="8" fill="#EEEDFE" stroke="#7F77DD"/>
<text x="128" y="152" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">учебный план</text>
<rect x="44" y="176" width="168" height="42" rx="8" fill="#EEEDFE" stroke="#7F77DD"/>
<text x="128" y="202" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">каждого ученика</text>
<rect x="44" y="226" width="168" height="42" rx="8" fill="#EEEDFE" stroke="#7F77DD"/>
<text x="128" y="252" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">тебя как учителя</text>
<line x1="212" y1="147" x2="250" y2="192" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="212" y1="197" x2="250" y2="205" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="212" y1="247" x2="250" y2="216" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="252" y="126" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#7F77DD"/>
<text x="352" y="145" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">методист · душа</text>
<text x="352" y="161" text-anchor="middle" font-size="12" fill="#534AB7">мозг TeacherAss · на HF</text>
<rect x="252" y="180" width="200" height="56" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="2.5"/>
<text x="352" y="204" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">живая память</text>
<text x="352" y="222" text-anchor="middle" font-size="12" fill="#0F6E56">Mem0 · растёт во времени</text>
<rect x="252" y="246" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="352" y="265" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Reachy Mini · тело</text>
<text x="352" y="281" text-anchor="middle" font-size="12" fill="#5F5E5A">портативный · в класс</text>

<text x="44" y="344" text-anchor="start" font-size="12" fill="#5F5E5A">что делает:</text>
<rect x="42" y="356" width="138" height="54" rx="8" fill="#FAECE7" stroke="#D85A30"/>
<text x="111" y="380" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">дай идею</text>
<text x="111" y="397" text-anchor="middle" font-size="12" fill="#993C1D">голос · камера</text>
<rect x="195" y="356" width="138" height="54" rx="8" fill="#FAECE7" stroke="#D85A30"/>
<text x="264" y="380" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">соберёт план</text>
<text x="264" y="397" text-anchor="middle" font-size="12" fill="#993C1D">из учебника</text>
<rect x="348" y="356" width="138" height="54" rx="8" fill="#FAECE7" stroke="#D85A30"/>
<text x="417" y="380" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">раздатки</text>
<text x="417" y="397" text-anchor="middle" font-size="12" fill="#993C1D">готовые</text>
<rect x="501" y="356" width="138" height="54" rx="8" fill="#FAECE7" stroke="#D85A30"/>
<text x="570" y="380" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">на принтер</text>
<text x="570" y="397" text-anchor="middle" font-size="12" fill="#993C1D">после одобрения</text>
<line x1="180" y1="383" x2="195" y2="383" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="333" y1="383" x2="348" y2="383" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="486" y1="383" x2="501" y2="383" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<text x="340" y="440" text-anchor="middle" font-size="12" fill="#5F5E5A">через полгода знает тебя, класс и программу — и едет с тобой в кабинет</text>
</svg>
