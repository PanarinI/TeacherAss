<svg width="100%" viewBox="0 0 680 424" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',sans-serif">
<title>TeacherAss — одна душа, три тела, два лагеря</title>
<desc>Сущность TeacherAss: одна неизменная душа (методист, живая память, материал из фото) воплощается в три тела, разделённые по ЦЕЛИ на два лагеря — КИВО-робот (валидация, не про деньги) и доход-софт (iOS и CWS). Нерешённая развилка внутри доход-лагеря iOS↔CWS и вилки сегмента ESL↔все и памяти MVP↔v2 отмечены жёлтым.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="2" y="2" width="676" height="420" rx="14" fill="#101418" stroke="#2a323c"/>

<text x="34" y="34" font-size="20" font-weight="700" fill="#c9a227">TeacherAss — одна душа · три тела</text>
<text x="34" y="53" font-size="12" fill="#8a94a0">сведение трёх воплощений (07-17): что не выбирается · где реальная развилка</text>

<!-- ДУША -->
<rect x="190" y="68" width="300" height="74" rx="10" fill="#14261d" stroke="#3fb27f"/>
<text x="340" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#3fb27f">ДУША — инвариант</text>
<text x="340" y="110" text-anchor="middle" font-size="12" fill="#dde3ea">методист · живая память · материал из фото</text>
<text x="340" y="130" text-anchor="middle" font-size="11" font-style="italic" fill="#8a94a0">не выбирается — сердце переживает переосмысление</text>

<text x="340" y="160" text-anchor="middle" font-size="11" fill="#8a94a0">щели поля (никем не заняты): методика-каркас · свой материал · память класса</text>

<!-- раздвоение -->
<path d="M340 142 L340 172" fill="none" stroke="#5b9bd5" stroke-width="1.4"/>
<path d="M340 172 L150 190" fill="none" stroke="#5b9bd5" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M340 172 L470 190" fill="none" stroke="#3fb27f" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- ЛАГЕРЬ КИВО -->
<rect x="34" y="194" width="232" height="150" rx="10" fill="none" stroke="#3a4550" stroke-dasharray="4 3"/>
<text x="50" y="212" font-size="12" font-weight="700" fill="#5b9bd5">ЛАГЕРЬ КИВО — валидация</text>
<rect x="56" y="222" width="188" height="108" rx="8" fill="#1a2027" stroke="#2a323c"/>
<text x="150" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#dde3ea">🤖 Робот · Reachy</text>
<text x="150" y="268" text-anchor="middle" font-size="11" fill="#8a94a0">форсаж · сеть · экспертное жюри</text>
<text x="150" y="286" text-anchor="middle" font-size="11" fill="#8a94a0">сознательно не про деньги</text>
<text x="150" y="312" text-anchor="middle" font-size="11" fill="#d9a53f">волна 2 · дедлайн 15.09</text>

<!-- ЛАГЕРЬ ДОХОД -->
<rect x="300" y="194" width="344" height="150" rx="10" fill="none" stroke="#3fb27f"/>
<text x="316" y="212" font-size="12" font-weight="700" fill="#3fb27f">ЛАГЕРЬ ДОХОД — деньги</text>
<rect x="314" y="222" width="146" height="108" rx="8" fill="#1a2027" stroke="#2a323c"/>
<text x="387" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#dde3ea">📱 Софт iOS</text>
<text x="387" y="266" text-anchor="middle" font-size="11" fill="#3fb27f">камера естественна ✅</text>
<text x="387" y="284" text-anchor="middle" font-size="11" fill="#d96459">датчик слеп ⬜</text>
<text x="387" y="310" text-anchor="middle" font-size="11" fill="#8a94a0">лид ~29–30/50 · Имя ⬜</text>

<rect x="484" y="222" width="146" height="108" rx="8" fill="#1a2027" stroke="#2a323c"/>
<text x="557" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#dde3ea">🧩 Софт CWS</text>
<text x="557" y="266" text-anchor="middle" font-size="11" fill="#3fb27f">датчик родной ✅</text>
<text x="557" y="284" text-anchor="middle" font-size="11" fill="#d96459">вход поздний</text>
<text x="557" y="310" text-anchor="middle" font-size="11" fill="#8a94a0">Brisk-сосед · ключ ≠ установка</text>

<!-- развилка молния -->
<text x="472" y="279" text-anchor="middle" font-size="16" fill="#d9a53f">⚡</text>
<path d="M462 292 L482 292" fill="none" stroke="#d9a53f" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

<!-- ВИЛКИ-КНОПКИ автора -->
<rect x="300" y="352" width="106" height="26" rx="13" fill="#2a241a" stroke="#d9a53f"/>
<text x="353" y="369" text-anchor="middle" font-size="10.5" fill="#d9a53f">форма: iOS ↔ CWS</text>
<rect x="414" y="352" width="112" height="26" rx="13" fill="#2a241a" stroke="#d9a53f"/>
<text x="470" y="369" text-anchor="middle" font-size="10.5" fill="#d9a53f">сегмент: ESL ↔ все</text>
<rect x="534" y="352" width="110" height="26" rx="13" fill="#2a241a" stroke="#d9a53f"/>
<text x="589" y="369" text-anchor="middle" font-size="10.5" fill="#d9a53f">память: MVP ↔ v2</text>

<!-- легенда -->
<text x="34" y="402" font-size="10.5" fill="#8a94a0">🟢 решено / живо · 🟡 нерешённая развилка = кнопка автора · ⬜ слепо (нет датчика) · 🔴 риск</text>
</svg>
